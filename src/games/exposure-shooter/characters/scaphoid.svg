<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs><clipPath id="scaphoid-card"><rect x="9" y="9" width="282" height="382" rx="25"/></clipPath></defs>
  <!-- 舟状骨（右手・尺屈位）：舟状骨そのものが顔。ほかの手根骨は顔なしの脇役、主役を金色の点線の輪で強調。
       尺屈で手先が尺側（画面右）へ傾く。R マーカー -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="6" width="288" height="388" rx="28" fill="#0f1826" stroke="#2f4462" stroke-width="6"/>

    <!-- 尺屈した手（中手骨ごと右へ傾ける） -->
    <g clip-path="url(#scaphoid-card)"><g transform="rotate(16 150 210)">
      <path d="M86 210 C82 150 90 70 100 14 H226 C232 70 232 150 222 210 Z" fill="#7f93a8" opacity="0.6"/>
      <g fill="none" stroke="#e8eef4" stroke-width="15" opacity="0.6">
        <path d="M118 196 L110 40"/>
        <path d="M146 192 L146 30"/>
        <path d="M174 194 L182 36"/>
        <path d="M200 200 L216 60"/>
      </g>
    </g></g>
    <!-- 母指（画面左） -->
    <path d="M96 236 L52 170" stroke="#7f93a8" stroke-width="40" opacity="0.6" fill="none"/>
    <path d="M100 232 L62 180" stroke="#e8eef4" stroke-width="14" opacity="0.6" fill="none"/>

    <!-- 手関節〜前腕の軟部組織 -->
    <path d="M78 214 H232 C236 260 230 300 222 384 H92 C86 300 74 260 78 214 Z" fill="#7f93a8" opacity="0.6"/>
    <!-- 脇役の手根骨（顔なし） -->
    <g fill="#e8eef4" opacity="0.45">
      <ellipse cx="160" cy="222" rx="18" ry="15"/>
      <ellipse cx="194" cy="226" rx="16" ry="14"/>
      <ellipse cx="128" cy="222" rx="14" ry="13"/>
      <ellipse cx="156" cy="262" rx="19" ry="17"/>
      <ellipse cx="194" cy="262" rx="16" ry="15"/>
      <circle cx="214" cy="248" r="9"/>
    </g>
    <!-- 橈骨（画面左）・尺骨（画面右） -->
    <path d="M86 300 C100 290 150 288 170 296 L162 394 H96 Z" fill="#e8eef4" opacity="0.6"/>
    <path d="M186 306 C198 300 214 302 220 310 L212 394 H188 Z" fill="#e8eef4" opacity="0.45"/>

    <!-- 主役：舟状骨（大きく明るく） -->
    <path d="M86 260 C76 232 94 210 116 216 C136 222 140 246 138 268 C136 292 116 304 100 296 C90 290 90 276 86 260 Z" fill="#e8eef4"/>
    <!-- 金色の点線の輪 -->
    <ellipse cx="112" cy="258" rx="50" ry="60" fill="none" stroke="#f5c56a" stroke-width="5" stroke-dasharray="10 10"/>
    <!-- R マーカー -->
    <rect x="244" y="24" width="34" height="40" rx="4" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="261" y="54" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">R</text>
  </g>

  <!-- 接近中：舟状骨の上に黒目 -->
  <g id="face-approach" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="102" cy="248" r="7" fill="#0f1826"/>
    <circle cx="124" cy="250" r="7" fill="#0f1826"/>
    <circle cx="100" cy="245" r="2.5" fill="#ffffff"/>
    <circle cx="122" cy="247" r="2.5" fill="#ffffff"/>
    <ellipse cx="96" cy="266" rx="7" ry="4" fill="#c96b7b"/>
    <ellipse cx="128" cy="268" rx="7" ry="4" fill="#c96b7b"/>
    <path d="M106 272 Q113 280 120 272" fill="none" stroke="#0f1826" stroke-width="4"/>
  </g>

  <!-- ロックオン -->
  <g id="face-lockon" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="102" cy="246" r="9" fill="#0f1826"/>
    <circle cx="124" cy="248" r="9" fill="#0f1826"/>
    <circle cx="102" cy="246" r="3" fill="#e8eef4"/>
    <circle cx="124" cy="248" r="3" fill="#e8eef4"/>
    <ellipse cx="96" cy="266" rx="7" ry="4" fill="#c96b7b"/>
    <ellipse cx="128" cy="268" rx="7" ry="4" fill="#c96b7b"/>
    <ellipse cx="113" cy="276" rx="5" ry="6" fill="#0f1826"/>
    <path d="M60 210 C52 222 52 232 60 234 C68 232 68 222 60 210 Z" fill="#8fd0ff" opacity="0.9"/>
  </g>

  <!-- 撃破 -->
  <g id="face-defeated" stroke-linecap="round" stroke-linejoin="round">
    <path d="M95 250 Q102 240 109 250" fill="none" stroke="#0f1826" stroke-width="5"/>
    <path d="M117 252 Q124 242 131 252" fill="none" stroke="#0f1826" stroke-width="5"/>
    <ellipse cx="96" cy="264" rx="8" ry="5" fill="#c96b7b"/>
    <ellipse cx="128" cy="266" rx="8" ry="5" fill="#c96b7b"/>
    <path d="M104 270 Q113 286 122 270 Z" fill="#c96b7b" stroke="#0f1826" stroke-width="3"/>
    <path d="M50 300 L56 316 L72 322 L56 328 L50 344 L44 328 L28 322 L44 316 Z" fill="#f5c56a"/>
    <path d="M176 160 L180 170 L190 174 L180 178 L176 188 L172 178 L162 174 L172 170 Z" fill="#f5c56a"/>
  </g>
</svg>
