<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <!-- 手正面（右手の PA）：中手骨の間＝両目（黒目）、指骨＝ツンツン頭、手根骨＝あご、母指は画面左、R マーカー -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="6" width="288" height="388" rx="28" fill="#0f1826" stroke="#2f4462" stroke-width="6"/>

    <!-- 軟部組織：手のひらと指 -->
    <g fill="none" stroke="#7f93a8" stroke-width="34" opacity="0.6">
      <path d="M112 190 L100 40"/>
      <path d="M144 186 L144 24"/>
      <path d="M176 188 L186 34"/>
      <path d="M204 200 L226 74"/>
      <path d="M100 286 L60 230 L40 176"/>
    </g>
    <path d="M90 180 H220 C228 230 226 290 210 340 L200 384 H110 L100 340 C88 290 84 230 90 180 Z" fill="#7f93a8" opacity="0.6"/>

    <!-- 指骨：ツンツン頭 -->
    <g fill="none" stroke="#e8eef4" stroke-width="13" opacity="0.85">
      <path d="M110 176 L106 132"/><path d="M105 122 L102 86"/><path d="M101 76 L99 50"/>
      <path d="M144 172 L144 124"/><path d="M144 114 L144 74"/><path d="M144 64 L144 36"/>
      <path d="M177 174 L180 128"/><path d="M181 118 L184 82"/><path d="M185 72 L187 46"/>
      <path d="M204 186 L212 146"/><path d="M214 136 L220 108"/><path d="M222 98 L226 80"/>
      <path d="M64 236 L50 204"/><path d="M46 194 L38 172"/>
    </g>
    <!-- 中手骨 -->
    <g fill="none" stroke="#e8eef4" stroke-width="15" opacity="0.8">
      <path d="M124 300 L112 192"/>
      <path d="M146 300 L144 188"/>
      <path d="M166 300 L176 190"/>
      <path d="M184 304 L204 200"/>
      <path d="M108 304 L72 250"/>
    </g>
    <!-- 手根骨：あご -->
    <g fill="#e8eef4" opacity="0.75">
      <circle cx="118" cy="320" r="14"/><circle cx="146" cy="318" r="14"/><circle cx="174" cy="320" r="14"/>
      <circle cx="128" cy="346" r="14"/><circle cx="160" cy="348" r="14"/><circle cx="188" cy="342" r="11"/>
    </g>
    <!-- 橈骨・尺骨 -->
    <path d="M110 364 H150 L146 394 H112 Z" fill="#e8eef4" opacity="0.55"/>
    <path d="M168 366 H198 L194 394 H170 Z" fill="#e8eef4" opacity="0.45"/>
    <!-- R マーカー -->
    <rect x="244" y="24" width="34" height="40" rx="4" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="261" y="54" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">R</text>
  </g>

  <!-- 接近中：中手骨の間の黒目 -->
  <g id="face-approach" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="129" cy="240" r="11" fill="#0f1826"/>
    <circle cx="125" cy="236" r="4" fill="#ffffff"/>
    <circle cx="183" cy="242" r="11" fill="#0f1826"/>
    <circle cx="179" cy="238" r="4" fill="#ffffff"/>
    <ellipse cx="114" cy="270" rx="12" ry="7" fill="#c96b7b" opacity="0.85"/>
    <ellipse cx="198" cy="272" rx="12" ry="7" fill="#c96b7b" opacity="0.85"/>
    <path d="M142 276 Q156 288 170 276" fill="none" stroke="#0f1826" stroke-width="6"/>
  </g>

  <!-- ロックオン -->
  <g id="face-lockon" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="129" cy="238" r="14" fill="#0f1826"/>
    <circle cx="129" cy="238" r="5" fill="#e8eef4"/>
    <circle cx="183" cy="240" r="14" fill="#0f1826"/>
    <circle cx="183" cy="240" r="5" fill="#e8eef4"/>
    <ellipse cx="114" cy="272" rx="12" ry="7" fill="#c96b7b"/>
    <ellipse cx="198" cy="274" rx="12" ry="7" fill="#c96b7b"/>
    <ellipse cx="156" cy="282" rx="8" ry="10" fill="#0f1826"/>
    <path d="M246 150 C236 166 236 178 246 180 C256 178 256 166 246 150 Z" fill="#8fd0ff" opacity="0.9"/>
  </g>

  <!-- 撃破 -->
  <g id="face-defeated" stroke-linecap="round" stroke-linejoin="round">
    <path d="M118 244 Q129 228 140 244" fill="none" stroke="#0f1826" stroke-width="7"/>
    <path d="M172 246 Q183 230 194 246" fill="none" stroke="#0f1826" stroke-width="7"/>
    <ellipse cx="114" cy="268" rx="13" ry="8" fill="#c96b7b"/>
    <ellipse cx="198" cy="270" rx="13" ry="8" fill="#c96b7b"/>
    <path d="M138 274 Q156 302 174 274 Z" fill="#c96b7b" stroke="#0f1826" stroke-width="5"/>
    <path d="M250 110 L256 126 L272 132 L256 138 L250 154 L244 138 L228 132 L244 126 Z" fill="#f5c56a"/>
    <path d="M40 300 L44 310 L54 314 L44 318 L40 328 L36 318 L26 314 L36 310 Z" fill="#f5c56a"/>
  </g>
</svg>
