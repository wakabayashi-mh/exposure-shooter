<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <!-- 胸部側面：前方（画面左）の肺野＝片目、両腕挙上（バンザイ）、胸椎＝背中側、心陰影＝前下方のハート、横隔膜＝口元、L マーカー -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="6" width="288" height="388" rx="28" fill="#0f1826" stroke="#2f4462" stroke-width="6"/>

    <!-- 挙上した両腕（軟部組織と上腕骨） -->
    <path d="M118 128 L96 20" stroke="#7f93a8" stroke-width="46" opacity="0.6" fill="none"/>
    <path d="M178 128 L196 20" stroke="#7f93a8" stroke-width="46" opacity="0.6" fill="none"/>
    <path d="M118 120 L100 30" stroke="#e8eef4" stroke-width="12" opacity="0.55" fill="none"/>
    <path d="M178 120 L192 30" stroke="#e8eef4" stroke-width="12" opacity="0.55" fill="none"/>

    <!-- 胴（前が画面左で丸く、背中が画面右でまっすぐ） -->
    <path d="M90 116 C56 132 40 190 42 250 C44 314 58 360 70 384 H250 C252 320 254 200 248 140 C240 120 220 112 200 112 Z" fill="#7f93a8" opacity="0.6"/>
    <!-- 肺野（暗い） -->
    <path d="M96 132 C70 150 62 206 66 262 C70 300 80 326 92 342 C130 330 170 330 214 340 C224 270 226 190 214 140 C190 126 130 122 96 132 Z" fill="#101b2b"/>
    <!-- 胸椎：背中側の骨の列 -->
    <g fill="#e8eef4" opacity="0.6">
      <rect x="216" y="136" width="26" height="20" rx="6"/>
      <rect x="216" y="162" width="26" height="20" rx="6"/>
      <rect x="216" y="188" width="26" height="20" rx="6"/>
      <rect x="216" y="214" width="26" height="20" rx="6"/>
      <rect x="216" y="240" width="26" height="20" rx="6"/>
      <rect x="216" y="266" width="26" height="20" rx="6"/>
      <rect x="216" y="292" width="26" height="20" rx="6"/>
      <rect x="216" y="318" width="26" height="20" rx="6"/>
    </g>
    <!-- 心陰影：前下方のハート -->
    <path d="M82 278 C82 258 108 254 112 274 C116 254 142 258 142 278 C142 300 116 312 112 328 C108 312 82 300 82 278 Z" fill="#e8eef4" opacity="0.5"/>
    <!-- L マーカー -->
    <rect x="244" y="24" width="34" height="40" rx="4" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="261" y="54" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">L</text>
  </g>

  <!-- 接近中：前（画面左）を向いた片目 -->
  <g id="face-approach" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="110" cy="196" rx="25" ry="30" fill="#e8eef4"/>
    <circle cx="102" cy="202" r="13" fill="#0f1826"/>
    <circle cx="97" cy="197" r="4" fill="#ffffff"/>
    <ellipse cx="96" cy="250" rx="16" ry="9" fill="#c96b7b" opacity="0.8"/>
    <path d="M76 332 Q116 360 160 334" fill="none" stroke="#e8eef4" stroke-width="9"/>
  </g>

  <!-- ロックオン -->
  <g id="face-lockon" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="110" cy="194" rx="29" ry="35" fill="#e8eef4"/>
    <circle cx="104" cy="196" r="8" fill="#0f1826"/>
    <ellipse cx="96" cy="254" rx="16" ry="9" fill="#c96b7b" opacity="0.9"/>
    <ellipse cx="112" cy="338" rx="13" ry="16" fill="#0f1826" stroke="#e8eef4" stroke-width="7"/>
    <path d="M168 150 C158 166 158 178 168 180 C178 178 178 166 168 150 Z" fill="#8fd0ff" opacity="0.9"/>
  </g>

  <!-- 撃破 -->
  <g id="face-defeated" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86 204 Q108 178 132 204" fill="none" stroke="#e8eef4" stroke-width="9"/>
    <ellipse cx="96" cy="246" rx="18" ry="10" fill="#c96b7b"/>
    <path d="M78 326 Q120 380 166 328 Z" fill="#c96b7b" stroke="#e8eef4" stroke-width="7"/>
    <path d="M40 120 L46 136 L62 142 L46 148 L40 164 L34 148 L18 142 L34 136 Z" fill="#f5c56a"/>
    <path d="M178 230 L182 240 L192 244 L182 248 L178 258 L174 248 L164 244 L174 240 Z" fill="#f5c56a"/>
  </g>
</svg>
