<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <!-- 手関節側面：掌側（画面左）を向く。月状骨＝片目（黒目）、橈骨手根関節の裂隙＝にっこり口、橈骨＝体、尺骨は後ろにうっすら、中手骨＝頭の上の毛、L マーカー -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="6" width="288" height="388" rx="28" fill="#0f1826" stroke="#2f4462" stroke-width="6"/>
    <path d="M86 14 H214 C222 120 226 220 222 384 H82 C74 220 78 120 86 14 Z" fill="#7f93a8" opacity="0.6"/>
    <!-- 中手骨：頭の上の毛 -->
    <g fill="none" stroke="#e8eef4" stroke-width="13" opacity="0.7">
      <path d="M130 140 L118 30"/><path d="M150 138 L150 24"/><path d="M170 140 L182 30"/>
    </g>
    <!-- 手根骨（遠位列） -->
    <ellipse cx="150" cy="156" rx="40" ry="22" fill="#e8eef4" opacity="0.6"/>
    <!-- 月状骨 -->
    <path d="M106 200 C106 170 194 170 194 200 C194 222 106 222 106 200 Z" fill="#e8eef4" opacity="0.95"/>
    <!-- 尺骨（後方にうっすら） -->
    <path d="M164 250 H206 L202 384 H168 Z" fill="#e8eef4" opacity="0.3"/>
    <!-- 橈骨：上縁はくぼんだ形 -->
    <path d="M98 236 Q150 262 202 236 C206 254 196 268 186 276 L180 384 H118 L114 276 C102 268 94 254 98 236 Z" fill="#e8eef4" opacity="0.85"/>
    <rect x="244" y="24" width="34" height="40" rx="4" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="261" y="54" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">L</text>
  </g>

  <!-- 接近中 -->
  <g id="face-approach" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="128" cy="198" r="9.35" fill="#0f1826"/><circle cx="124.6" cy="193.75" r="3.4" fill="#ffffff"/><ellipse cx="120" cy="248" rx="10.5" ry="6.3" fill="#c96b7b" opacity="0.85"/><path d="M116 226 Q150 246.4 184 226" fill="none" stroke="#0f1826" stroke-width="7"/>
  </g>

  <!-- ロックオン・曝射中 -->
  <g id="face-lockon" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="128" cy="196" r="11.9" fill="#0f1826"/><circle cx="128" cy="196" r="4.25" fill="#e8eef4"/><ellipse cx="120" cy="250" rx="10.5" ry="6.3" fill="#c96b7b" opacity="1"/><ellipse cx="152" cy="230" rx="10" ry="8" fill="#0f1826"/><path d="M236 110 C226 126 226 138 236 140 C246 138 246 126 236 110 Z" fill="#8fd0ff" opacity="0.9"/>
  </g>

  <!-- 撃破 -->
  <g id="face-defeated" stroke-linecap="round" stroke-linejoin="round">
    <path d="M116.8 205.2 Q128 189.2 139.2 205.2" fill="none" stroke="#0f1826" stroke-width="6.4"/><ellipse cx="118" cy="246" rx="12" ry="7.2" fill="#c96b7b" opacity="1"/><path d="M118 224 Q152 266 186 224 Z" fill="#c96b7b" stroke="#0f1826" stroke-width="5"/><path d="M56 98 L62 114 L78 120 L62 126 L56 142 L50 126 L34 120 L50 114 Z" fill="#f5c56a"/><path d="M246 186.8 L249.6 196.4 L259.2 200 L249.6 203.6 L246 213.2 L242.4 203.6 L232.8 200 L242.4 196.4 Z" fill="#f5c56a"/>
  </g>
</svg>
